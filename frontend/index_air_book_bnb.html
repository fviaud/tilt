
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Airbnb Clone</title>
    <style>
        body {
            margin: 0;
            background: #fff;
            color: #222;
            font-family: 'Segoe UI', Arial, Helvetica, sans-serif;
        }
        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 40px;
            background: #fff;
            border-bottom: 1px solid #eee;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .navbar .logo {
            color: #FF385C;
            font-size: 2rem;
            font-weight: bold;
            letter-spacing: 1px;
        }
        .navbar nav a {
            color: #222;
            text-decoration: none;
            margin-right: 24px;
            font-size: 1rem;
            font-weight: 500;
            transition: color 0.2s;
        }
        .navbar nav a:last-child {
            margin-right: 0;
        }
        .navbar nav a:hover {
            color: #FF385C;
        }
        .search-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 40px 0 30px 0;
        }
        .search-bar input {
            width: 350px;
            padding: 14px 18px;
            border: 1px solid #ddd;
            border-radius: 30px 0 0 30px;
            font-size: 1rem;
            outline: none;
        }
        .search-bar button {
            padding: 14px 24px;
            border: none;
            background: #FF385C;
            color: #fff;
            font-size: 1rem;
            border-radius: 0 30px 30px 0;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        .search-bar button:hover {
            background: #d81e43;
        }
        .listings {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 32px;
            padding: 0 40px 40px 40px;
        }
        .card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.07);
            overflow: hidden;
            transition: box-shadow 0.2s, transform 0.2s;
            cursor: pointer;
            border: 1px solid #eee;
        }
        .card:hover {
            box-shadow: 0 8px 24px rgba(0,0,0,0.13);
            transform: translateY(-4px) scale(1.02);
        }
        .card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }
        .card-body {
            padding: 18px 18px 14px 18px;
        }
        .card-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 6px;
        }
        .card-location {
            color: #717171;
            font-size: 0.97rem;
            margin-bottom: 8px;
        }
        .card-price {
            font-size: 1rem;
            font-weight: 500;
        }
        .card-rating {
            color: #FF385C;
            font-size: 0.95rem;
            float: right;
        }
    </style>
</head>
<body>
    <div class="navbar">
        <span class="logo">airbookbnb</span>
        <nav>
            <a href="#">Hébergements</a>
            <a href="#">Expériences</a>
            <a href="#">En ligne</a>
        </nav>
    </div>
    <div class="search-bar">
        <input type="text" placeholder="Rechercher des destinations, hébergements...">
        <button>Rechercher</button>
    </div>
    <div class="listings">
        <div class="card">
            <img src="https://images.pexels.com/photos/14369630/pexels-photo-14369630.jpeg?auto=compress&cs=tinysrgb&w=720&fit=max" alt="Maison type Airbnb libre de droits">
            <div class="card-body">
                <div class="card-title">Loft lumineux à Paris</div>
                <div class="card-location">Paris, France</div>
                <div class="card-price">120€ / nuit <span class="card-rating">★ 4.92</span></div>
            </div>
        </div>
        <div class="card">
            <img src="https://images.pexels.com/photos/10511470/pexels-photo-10511470.jpeg?auto=compress&cs=tinysrgb&w=720&fit=max" alt="Maison bois moderne libre de droits">
            <div class="card-body">
                <div class="card-title">Appartement vue mer</div>
                <div class="card-location">Marseille, France</div>
                <div class="card-price">95€ / nuit <span class="card-rating">★ 4.80</span></div>
            </div>
        </div>
        <div class="card">
            <img src="https://images.pexels.com/photos/16790836/pexels-photo-16790836.jpeg?auto=compress&cs=tinysrgb&w=720&fit=max" alt="Maison campagne montagne libre de droits">
            <div class="card-body">
                <div class="card-title">Chalet cosy dans les Alpes</div>
                <div class="card-location">Chamonix, France</div>
                <div class="card-price">180€ / nuit <span class="card-rating">★ 5.00</span></div>
            </div>
        </div>
        <div class="card">
            <img src="https://images.pexels.com/photos/11392441/pexels-photo-11392441.jpeg?auto=compress&cs=tinysrgb&w=720&fit=max" alt="Villa moderne libre de droits">
            <div class="card-body">
                <div class="card-title">Villa avec piscine</div>
                <div class="card-location">Bordeaux, France</div>
                <div class="card-price">250€ / nuit <span class="card-rating">★ 4.85</span></div>
            </div>
        </div>
    </div>
</body>
</html>
